{% extends "base.html" %}
{% block title %}Patient Login{% endblock %}
{% block content %}
<section class="section">
  <div class="wrap" style="max-width: 520px;">
    <header class="section-head">
      <h1>Patient sign in</h1>
      <p class="muted">Access your dashboard, history, and bookings.</p>
    </header>

    <div class="card">
      <form method="post" class="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" class="input" id="email" name="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" class="input" id="password" name="password" required minlength="6" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>
      <p class="muted small" style="margin-top: 12px;">No account? <a href="{{ url_for('patient.register') }}">Register</a></p>
    </div>
  </div>
</section>
{% endblock %}
